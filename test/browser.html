<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xqshare UMD test</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../lib/css/xqshare.min.css">
    <link rel="stylesheet" href="./demo.css">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="./">
            <img src="./icon.svg" alt="" width="30" height="30">
            <span>xqshare test lab</span>
        </a>
        <nav aria-label="Test pages">
            <a href="./browser.html" aria-current="page">UMD</a>
            <a href="./esm.html">ESM</a>
            <a href="./vue2.html">Vue 2</a>
            <a href="./vue3.html">Vue 3</a>
        </nav>
    </header>
    <main class="shell">
        <section class="status-band">
            <div>
                <p class="eyebrow">Browser bundle</p>
                <h1>UMD runtime</h1>
            </div>
            <div id="summary" class="status-badge is-running" data-status="running" aria-live="polite">RUNNING</div>
        </section>
        <section class="workspace" aria-label="UMD checks">
            <div class="workbench">
                <div class="test-stage" id="shareHost" aria-label="default widget"></div>
                <div class="test-stage-grid">
                    <div class="test-stage" id="popHost" aria-label="pop widget"></div>
                    <div class="test-stage" id="slideHost" aria-label="slide widget"></div>
                </div>
                <div class="test-stage-grid">
                    <div class="test-stage" id="dupA" aria-label="first duplicate"></div>
                    <div class="test-stage" id="dupB" aria-label="second duplicate"></div>
                </div>
            </div>
            <aside class="checks-panel">
                <h2>Checks</h2>
                <ol id="checks" class="check-list"></ol>
                <pre id="details" class="check-details">Waiting for checks.</pre>
            </aside>
        </section>
    </main>

    <script src="../lib/js/xqshare.min.js"></script>
    <script type="module">
        import { coreChecks } from './share-demo.js';
        import { createCheckRunner } from './checks.js';

        const runner = createCheckRunner({ page: 'browser' });
        await runner.run(coreChecks(window.XqShare, 'Browser'));
    </script>
</body>

</html>
